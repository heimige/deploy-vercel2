<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>环境保护</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f8f0;color:#333;line-height:1.6}
header{background:#2e7d32;color:#fff;text-align:center;padding:30px}
main{max-width:700px;margin:30px auto;padding:0 20px}
h2{color:#2e7d32;margin:20px 0 10px}
ul{padding-left:20px}
footer{background:#2e7d32;color:#fff;text-align:center;padding:15px;margin-top:40px}
</style>
</head>
<body>
<header>
<h1>保护环境 人人有责</h1>
</header>
<main>
<h2>为什么要环保</h2>
<p>地球是我们共同的家园，保护环境可以保护动植物，减少污染，让空气和水源更干净。</p>

<h2>我们可以做什么</h2>
<ul>
<li>节约水电，随手关灯关水龙头</li>
<li>不乱扔垃圾，做好垃圾分类</li>
<li>少用塑料袋，减少白色污染</li>
<li>多植树，爱护花草树木</li>
<li>绿色出行，多步行或坐公交</li>
</ul>
</main>
<footer>
<p>保护环境，从我做起 ©2026</p>
</footer>
</body>
</html>
